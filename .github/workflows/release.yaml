name: Release

# scripts/release.sh pushes a tag on a "Prepare release" commit that is not on main yet.
on:
  push:
    tags:
      - "*"

env:
  APP_DIR: nmea_static_gps_server
  VERSION: ${{ github.ref_name }}

concurrency: release

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release commit
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like 1.2.0"
            exit 1
          fi
          if ! grep -qxF "version: \"${VERSION}\"" "${APP_DIR}/config.yaml"; then
            echo "::error::${APP_DIR}/config.yaml is not at version ${VERSION}"
            exit 1
          fi
          if ! grep -qxF "## ${VERSION}" "${APP_DIR}/CHANGELOG.md"; then
            echo "::error::${APP_DIR}/CHANGELOG.md has no '## ${VERSION}' entry"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::The tagged commit does not fast-forward main"
            exit 1
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yaml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ github.ref_name }}
      publish: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only after the images are pushed: the Supervisor offers the update as soon as main has the new version.
      - name: Fast-forward main to the release
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" -f sha="${GITHUB_SHA}" -F force=false

      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release
        run: |
          awk -v heading="## ${VERSION}" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            "${APP_DIR}/CHANGELOG.md" > release-notes.md
          gh release create "${VERSION}" --title "${VERSION}" --notes-file release-notes.md --verify-tag
