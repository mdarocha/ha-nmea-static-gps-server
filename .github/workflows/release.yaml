name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0. CHANGELOG.md needs a matching entry.
        required: true
        type: string

env:
  APP_DIR: nmea_static_gps_server
  CHANGELOG: docs/CHANGELOG.md
  VERSION: ${{ inputs.version }}

concurrency: release

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be run from main"
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0"
            exit 1
          fi
          if ! grep -qxF "## ${VERSION}" "${CHANGELOG}"; then
            echo "::error::${CHANGELOG} has no '## ${VERSION}' entry"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}
      publish: true

  release:
    name: Bump version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # Only after the push: the Supervisor offers the update as soon as it sees the version.
      - name: Bump app version
        run: |
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" "${APP_DIR}/config.yaml"

      # Tags can only be created by an admin, so scripts/release.sh tags and publishes the release afterwards.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -m "Release ${VERSION}" "${APP_DIR}/config.yaml"
          git push origin HEAD:main
