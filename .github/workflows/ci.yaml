name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: dev
      publish: false
